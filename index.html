<!-- Menü (Ziyaretçi veya Üye) -->
  <nav class="header-nav" id="mainHeaderNav">
    <a href="#landingSection" class="nav-item active" id="navHome">Ana Sayfa</a>
    
    
    

  </nav>

  <!-- Aksiyon Butonları -->
  <div class="header-actions" id="headerActions">
    
    <!-- ZİYARETÇİ MODU (GİRİŞ YAPILMAMIŞSA) -->
    <div id="guestHeaderActions" style="display:flex; align-items:center; gap:0.65rem;">
      <button class="btn-login-trigger" id="btnOpenLoginModal" onclick="window.openLoginModal()">
        <span>Giriş Yap</span>
      </button>
      <button class="btn-register-trigger" id="btnOpenRegisterModal" onclick="window.openRegisterModal()">
        <span>✨ Ücretsiz Üye Ol</span>
      </button>
    </div>

    <!-- ÜYE GİRİŞİ YAPILMIŞSA GÖRÜNEN MOD -->
    <div id="memberHeaderActions" style="display:none; align-items:center; gap:0.65rem;">
      <!-- VIP Yükseltme Butonu -->
      <button class="btn-vip-upgrade" id="btnOpenVipModal" onclick="window.openVipModal()">
        <span>👑</span>
        <span id="headerVipBtnText">VIP Üye Ol</span>
      </button>

      <!-- Mesaj Kutusu Butonu -->
      <button class="icon-counter-btn" id="btnOpenInbox" title="Mesajlarım & Sohbetler" onclick="window.openInboxModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="counter-badge" id="inboxCount">1</span>
      </button>

      <!-- Göz Kırpma Butonu -->
      <button class="icon-counter-btn winks" id="btnWinkList" title="Göz Kırpmalar" onclick="window.openWinksModal()">
        <span>😉</span>
        <span class="counter-badge" id="winkCount">0</span>
      </button>

      <!-- Favoriler Butonu -->
      <button class="icon-counter-btn" id="btnOpenFavorites" title="Favorilerim">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="counter-badge" id="favCount">0</span>
      </button>

      <!-- Profilim -->
      <button class="btn-my-profile" id="btnOpenMyProfile" title="Kendi Profilim" onclick="window.openMyProfile()">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="header-user-avatar" id="headerMyAvatar">
        <span id="headerUserName">Profilim</span>
        <span class="gender-membership-badge male-free" id="headerUserBadge">STANDART</span>
      </button>

      <!-- Çıkış Yap Butonu -->
      <button class="btn-logout" id="btnLogout" title="Güvenli Çıkış Yap" style="background:#1E293B; color:#94A3B8; border:1px solid rgba(255,255,255,0.08); padding:0.45rem 0.75rem; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer;">
        <span>Çıkış ✕</span>
      </button>
    </div>

  </div>
</div>
