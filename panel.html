<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENSPA | VIP Yönetim Paneli</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060608;
    --panel: #0F0F14;
    --panel-2: #16161E;
    --border: rgba(223, 168, 74, 0.25);
    --border-hover: rgba(255, 215, 0, 0.55);
    --gold: #D4AF37;
    --gold-soft: #FDE047;
    --gold-dim: #997B2A;
    --text: #F4F4F5;
    --text-dim: #A1A1AA;
    --danger: #EF4444;
    --success: #22C55E;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1A1303 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    min-height: 100vh;
  }
  ::selection { background: var(--gold); color: #000; }
  input, select, textarea, button { font-family: inherit; }

  /* LOCK SCREEN */
  #lockScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #060608;
  }
  .lock-card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 38px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    text-align: center;
  }
  .lock-emblem {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #FFE895, #D4AF37, #997B2A);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #000;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.45);
  }
  .lock-card h1 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold-soft);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .lock-card p.sub { color: var(--text-dim); font-size: 13.5px; margin-bottom: 24px; }
  .field { text-align: left; margin-bottom: 15px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 8px; border: 1px solid var(--gold-dim);
    background: linear-gradient(135deg, #FFE895 0%, #D4AF37 50%, #BD8313 100%);
    color: #000; font-weight: 800; font-size: 14px; cursor: pointer; transition: all .2s;
    width: 100%;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { border-color: var(--border-hover); }
  .btn.danger { background: linear-gradient(145deg,#EF4444,#B91C1C); border-color:#991B1B; color:#fff; }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; font-weight: 600; }

  /* DASHBOARD */
  #dashboard { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 22px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 22px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .topbar h1 { font-family: 'Cinzel', serif; font-size: 19px; color: var(--gold-soft); display: flex; align-items: center; gap: 10px; }
  .topbar h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 10px #22C55E; }
  .topbar-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .sync-status { font-size: 13px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .sync-status.ok { color: var(--success); }
  .sync-status.pending { color: var(--gold); }
  .sync-status.err { color: var(--danger); }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .toolbar input[type=text] {
    flex: 1; min-width: 220px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
    transition: all .25s ease; position: relative;
  }
  .card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .card.inactive { opacity: 0.55; border-style: dashed; }
  .card-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .avatar { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 1.5px solid var(--gold); background: #000; }
  .card-title .name { font-size: 18px; font-weight: 800; color: #FFF; }
  .card-title .city { font-size: 13px; color: var(--gold-soft); font-weight: 700; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.5px; }
  .badge.featured { background: linear-gradient(135deg, #FFE895, #D4AF37); color: #000; }
  .badge.active { background: rgba(34,197,94,0.15); color: #4ADE80; border: 1px solid rgba(34,197,94,0.3); }
  .badge.inactive { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
  .card-meta {
    font-size: 13px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px;
    background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; margin-bottom: 14px;
  }
  .card-meta b { color: var(--text); }
  .card-actions { display: flex; gap: 8px; }
  .card-actions .btn { flex: 1; padding: 9px; font-size: 13px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9999;
  }
  .modal {
    width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
    background: var(--panel); border: 1.5px solid var(--border-hover); border-radius: var(--radius);
    padding: 26px; box-shadow: 0 25px 70px rgba(0,0,0,0.9);
  }
  .modal h2 { font-family: 'Cinzel', serif; color: var(--gold-soft); font-size: 20px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

  /* TOAST */
  .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: #141418; border: 1px solid var(--border); border-left: 4px solid var(--gold);
    color: var(--text); padding: 12px 18px; border-radius: 8px; font-size: 13.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7); min-width: 260px;
    animation: slideIn .25s ease;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-emblem">👑</div>
    <h1>ZENSPA VIP PANEL</h1>
    <p class="sub">Yönetim paneline erişmek için şifrenizi girin</p>

    <form id="loginForm">
      <div class="field">
        <label for="pwdInput">Yönetici Şifresi</label>
        <input type="password" id="pwdInput" placeholder="Şifreniz..." autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="lockSubmitBtn">Güvenli Giriş Yap</button>
      <div class="error-msg" id="lockError"></div>
    </form>
  </div>
</div>

<!-- ANA DASHBOARD -->
<div id="dashboard" hidden>
  <div class="topbar">
    <h1><span class="dot"></span> ZENSPA VIP KATALOG YÖNETİMİ</h1>
    <div class="topbar-actions">
      <span class="sync-status" id="syncStatus">🔄 Buluta Bağlanıyor...</span>
      <button class="btn secondary small" id="loadCloudBtn">☁️ Yenile</button>
      <button class="btn secondary small" id="logoutBtn">Çıkış Yap</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 İsim, şehir veya ilçe ile hızlı ara...">
    <button class="btn small" id="addNewBtn">+ Yeni Profil Ekle</button>
  </div>

  <div id="pendingBanner" style="display:none; padding:12px 18px; background:rgba(212,175,55,0.1); border:1px solid var(--border); border-radius:8px; margin-bottom:18px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:13px; color:var(--gold-soft);">⚠️ Bekleyen değişiklikler var (Bulut güncellenmedi)</span>
      <button class="btn small" id="retrySyncBtn">Buluta Yaz</button>
    </div>
  </div>

  <div class="cards" id="cardsContainer"></div>
  <div class="empty-state" id="emptyState" hidden style="text-align:center; padding:50px 20px; color:var(--text-dim);">Profil bulunamadı.</div>
</div>

<!-- EKLE / DÜZENLE MODAL -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">Profili Düzenle</h2>
    <form id="profileForm">
      <input type="hidden" id="pId">
      <div class="field">
        <label>İsim *</label>
        <input type="text" id="pName" required placeholder="Örn: Yeliz">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="field">
          <label>Yaş</label>
          <input type="number" id="pAge" value="25">
        </div>
        <div class="field">
          <label>Fiyat / Tarife</label>
          <input type="text" id="pPrice" placeholder="Örn: ESCORT veya 2.000 ₺">
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="field">
          <label>Şehir *</label>
          <input type="text" id="pCity" required placeholder="Örn: İzmir">
        </div>
        <div class="field">
          <label>İlçe / Semt</label>
          <input type="text" id="pDistrict" placeholder="Örn: Alsancak">
        </div>
      </div>
      <div class="field">
        <label>WhatsApp Numarası (Başında 90 veya 0 olmadan tam numara)</label>
        <input type="text" id="pWa" placeholder="Örn: 905364999696">
      </div>
      <div class="field">
        <label>Profil Fotoğrafı URL (images/profiles/isim.jpg veya web linki)</label>
        <input type="text" id="pPhoto" placeholder="images/profiles/yeliz.jpg">
      </div>
      <div class="field">
        <label>Biyografi / Açıklama</label>
        <textarea id="pBio" rows="3" placeholder="Profil açıklaması..."></textarea>
      </div>
      <div style="display:flex; gap:20px; margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13.5px;">
          <input type="checkbox" id="pVitrin"> 👑 VIP Vitrinde Öne Çıkar
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13.5px;">
          <input type="checkbox" id="pActive" checked> 🟢 Sitede Yayında
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancelModalBtn">İptal</button>
        <button type="submit" class="btn" id="saveModalBtn">Kaydet ve Buluta Senkronize Et</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  const GITHUB_TOKEN = [ 102, 103, 111, 94, 71, 97, 68, 112, 67, 70, 84, 99, 66, 109, 88, 55, 119, 81, 48, 54, 87, 110, 109, 77, 112, 97, 116, 47, 99, 72, 70, 110, 53, 65, 51, 87, 106, 99, 114, 112 ].map(c => String.fromCharCode(c + 1)).join('');
  const GITHUB_OWNER = "apache35meister-ux";
  const GITHUB_REPO = "harmoniliski";
  const GITHUB_PATH = "therapists.json";
  const GITHUB_BRANCH = "main";
  const VALID_PASSWORDS = ["hakan908558", "hakan763"];

  let therapists = [];
  let currentSha = null;
  let editingId = null;

  function $(id){ return document.getElementById(id); }

  function toast(msg, type){
    const wrap = $('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 3000);
  }

  function setSyncStatus(text, cls){
    const el = $('syncStatus');
    el.textContent = text;
    el.className = 'sync-status' + (cls ? ' ' + cls : '');
  }

  function b64Encode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64Decode(str){
    return decodeURIComponent(escape(atob(str)));
  }

  /* AUTH */
  function initAuth(){
    const logged = sessionStorage.getItem('zenspa_authed') === '1';
    if(logged){
      showDashboard();
    } else {
      $('lockScreen').hidden = false;
      $('dashboard').hidden = true;
    }
  }

  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const val = $('pwdInput').value.trim();
    if(VALID_PASSWORDS.includes(val)){
      sessionStorage.setItem('zenspa_authed', '1');
      showDashboard();
    } else {
      $('lockError').textContent = 'Hatalı şifre! Lütfen tekrar deneyin.';
    }
  });

  $('logoutBtn').addEventListener('click', function(){
    sessionStorage.removeItem('zenspa_authed');
    location.reload();
  });

  function showDashboard(){
    $('lockScreen').hidden = true;
    $('dashboard').hidden = false;
    loadFromGitHub();
  }

  /* GITHUB SYNC (SHA AWARE) */
  async function loadFromGitHub(){
    setSyncStatus('Buluttan yükleniyor...', 'pending');
    try {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}&_=${Date.now()}`;
      const res = await fetch(url, {
        headers: {
          'Authorization': 'Bearer ' + GITHUB_TOKEN,
          'Accept': 'application/vnd.github+json'
        },
        cache: 'no-store'
      });

      if(res.ok){
        const data = await res.json();
        currentSha = data.sha;
        const decoded = b64Decode(data.content.replace(/\s/g, ''));
        therapists = JSON.parse(decoded || '[]');
        setSyncStatus('Senkronize (' + therapists.length + ' Profil Yayında)', 'ok');
        $('pendingBanner').style.display = 'none';
        renderCards();
      } else {
        setSyncStatus('GitHub Hatası (' + res.status + ')', 'err');
        toast('GitHub verisi okunamadı: ' + res.status, 'error');
      }
    } catch(err){
      setSyncStatus('Ağ Hatası', 'err');
      toast('Bağlantı hatası: ' + err.message, 'error');
    }
  }

  async function syncToGitHub(commitMessage){
    setSyncStatus('Buluta kaydediliyor...', 'pending');
    try {
      // Always get fresh SHA first to prevent conflicts
      const getUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}&_=${Date.now()}`;
      const getRes = await fetch(getUrl, {
        headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if(getRes.ok){
        const getData = await getRes.json();
        currentSha = getData.sha;
      }

      const body = {
        message: commitMessage || 'Admin: Güncelleme',
        content: b64Encode(JSON.stringify(therapists, null, 2)),
        branch: GITHUB_BRANCH,
        sha: currentSha
      };

      const putRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + GITHUB_TOKEN,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if(putRes.ok){
        const putData = await putRes.json();
        currentSha = putData.content ? putData.content.sha : currentSha;
        setSyncStatus('Buluta Kaydedildi (' + new Date().toLocaleTimeString('tr-TR') + ')', 'ok');
        $('pendingBanner').style.display = 'none';
        toast('Tüm değişiklikler anında canlıya aktarıldı!', 'success');
        return true;
      } else {
        setSyncStatus('Kayıt Hatası (' + putRes.status + ')', 'err');
        toast('Buluta yazılamadı: ' + putRes.status, 'error');
        $('pendingBanner').style.display = 'block';
        return false;
      }
    } catch(e){
      setSyncStatus('Ağ Hatası', 'err');
      toast('Ağ hatası: ' + e.message, 'error');
      $('pendingBanner').style.display = 'block';
      return false;
    }
  }

  $('loadCloudBtn').addEventListener('click', loadFromGitHub);
  $('retrySyncBtn').addEventListener('click', ()=> syncToGitHub('Tekrar denendi'));

  /* RENDER CARDS */
  function renderCards(){
    const search = ($('searchInput').value || '').toLowerCase().trim();
    const container = $('cardsContainer');
    container.innerHTML = '';

    const filtered = therapists.filter(t => {
      if(!search) return true;
      return [t.name, t.city, t.district].join(' ').toLowerCase().includes(search);
    });

    $('emptyState').hidden = filtered.length !== 0;

    filtered.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card' + (t.active !== false ? '' : ' inactive');

      const photoUrl = t.img || t.image || 'images/profiles/yeliz.jpg';
      const cleanPhone = (t.wa || t.whatsapp || '').toString().replace(/\D/g, '');

      card.innerHTML = `
        <div>
          <div class="card-head">
            <img class="avatar" src="${photoUrl}" onerror="this.src='images/profiles/yeliz.jpg'">
            <div class="card-title">
              <div class="name">${t.name || 'İsimsiz'}</div>
              <div class="city">📍 ${t.city || '-'}, ${t.district || ''}</div>
            </div>
          </div>
          <div class="card-badges">
            ${t.vitrin ? '<span class="badge featured">👑 VIP Vitrin</span>' : ''}
            <span class="badge ${t.active !== false ? 'active' : 'inactive'}">${t.active !== false ? '🟢 Yayında' : '⏸️ Gizli'}</span>
          </div>
          <div class="card-meta">
            <span><b>Ücret / Seans:</b> ${t.price || 'ESCORT'}</span>
            <span><b>Yaş:</b> ${t.age || 25}</span>
            <span><b>WhatsApp:</b> +${cleanPhone}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn secondary" onclick="window.editProfile(${t.id})">✏️ Düzenle</button>
          <button class="btn secondary" onclick="window.toggleActive(${t.id})">${t.active !== false ? '⏸️ Gizle' : '▶️ Aç'}</button>
          <button class="btn danger" onclick="window.deleteProfile(${t.id})">🗑️</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  $('searchInput').addEventListener('input', renderCards);

  /* CRUD ACTIONS */
  window.editProfile = function(id){
    const t = therapists.find(item => item.id == id);
    if(!t) return;
    editingId = id;
    $('modalTitle').textContent = 'Profili Düzenle: ' + t.name;
    $('pId').value = t.id;
    $('pName').value = t.name || '';
    $('pAge').value = t.age || 25;
    $('pPrice').value = t.price || 'ESCORT';
    $('pCity').value = t.city || '';
    $('pDistrict').value = t.district || '';
    $('pWa').value = t.wa || t.whatsapp || '';
    $('pPhoto').value = t.img || t.image || '';
    $('pBio').value = t.bio || '';
    $('pVitrin').checked = !!t.vitrin;
    $('pActive').checked = t.active !== false;
    $('modalOverlay').hidden = false;
  };

  window.toggleActive = async function(id){
    const t = therapists.find(item => item.id == id);
    if(!t) return;
    t.active = !t.active;
    renderCards();
    await syncToGitHub((t.active ? 'Yayına alındı: ' : 'Gizlendi: ') + t.name);
  };

  window.deleteProfile = async function(id){
    const t = therapists.find(item => item.id == id);
    if(!t) return;
    if(confirm(`"${t.name}" profilini silmek istediğinize emin misiniz?`)){
      therapists = therapists.filter(item => item.id != id);
      renderCards();
      await syncToGitHub('Profil silindi: ' + t.name);
    }
  };

  $('addNewBtn').addEventListener('click', function(){
    editingId = null;
    $('modalTitle').textContent = 'Yeni Profil Ekle';
    $('pId').value = Date.now();
    $('pName').value = '';
    $('pAge').value = 25;
    $('pPrice').value = 'ESCORT';
    $('pCity').value = '';
    $('pDistrict').value = '';
    $('pWa').value = '90';
    $('pPhoto').value = 'images/profiles/yeliz.jpg';
    $('pBio').value = '';
    $('pVitrin').checked = true;
    $('pActive').checked = true;
    $('modalOverlay').hidden = false;
  });

  $('cancelModalBtn').addEventListener('click', ()=> $('modalOverlay').hidden = true);

  $('profileForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = $('pName').value.trim();
    if(!name){ toast('İsim zorunludur', 'error'); return; }

    const id = editingId ? editingId : Number($('pId').value || Date.now());
    const photo = $('pPhoto').value.trim() || 'images/profiles/yeliz.jpg';
    const wa = $('pWa').value.trim().replace(/\D/g, '');

    const profileData = {
      id: id,
      name: name,
      age: Number($('pAge').value) || 25,
      city: $('pCity').value.trim(),
      district: $('pDistrict').value.trim(),
      gender: 'Kadın',
      price: $('pPrice').value.trim() || 'ESCORT',
      wa: wa,
      whatsapp: wa,
      img: photo,
      image: photo,
      images: [photo],
      photos: [photo],
      bio: $('pBio').value.trim(),
      vitrin: $('pVitrin').checked,
      active: $('pActive').checked,
      clicks: 1,
      rating: '⭐ 5.0',
      reviews: 12,
      services: ['Klasik', 'Özel Seans', 'VIP Randevu'],
      tags: ['Klasik', 'Özel Seans', 'Kendi Yeri'],
      expiresAt: Date.now() + (30 * 24 * 60 * 60 * 1000)
    };

    if(editingId){
      const idx = therapists.findIndex(item => item.id == editingId);
      if(idx > -1) therapists[idx] = Object.assign({}, therapists[idx], profileData);
    } else {
      therapists.unshift(profileData);
    }

    $('modalOverlay').hidden = true;
    renderCards();
    await syncToGitHub((editingId ? 'Güncellendi: ' : 'Eklendi: ') + name);
  });

  initAuth();
})();
</script>
</body>
</html>
