<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=../panel.html">
  <script>window.location.replace('../panel.html' + window.location.search);</script>
  <title>VIP Yönetim Paneli</title>
</head>
<body style="background:#050507; color:#FFE895; font-family:sans-serif; text-align:center; padding:3rem;">
  <h2>Yönetim Paneline Yönlendiriliyorsunuz...</h2>
  <p><a href="../panel.html" style="color:#FFF;">Açılmazsa buraya tıklayınız</a></p>

<script>
/* Gercek Analitik - counterapi.dev */
(function(){
  try {
    var NS = 'harmoniliski2026';
    var page = (location.pathname.split('/').pop() || 'anasayfa').replace('.html','').replace(/[^a-z0-9-]/gi,'-').toLowerCase().slice(0,30) || 'anasayfa';
    var today = new Date().toISOString().slice(0,10);
    // Toplam + bugun + sayfa bazli ziyaret say
    fetch('https://api.counterapi.dev/v1/'+NS+'/total/up').catch(function(){});
    fetch('https://api.counterapi.dev/v1/'+NS+'/gun-'+today+'/up').catch(function(){});
    fetch('https://api.counterapi.dev/v1/'+NS+'/sayfa-'+page+'/up').catch(function(){});
    // WhatsApp tiklama takibi
    document.addEventListener('click', function(e){
      var a = e.target.closest('a');
      if(a && a.href && (a.href.indexOf('wa.me')>-1 || a.href.indexOf('whatsapp')>-1)){
        fetch('https://api.counterapi.dev/v1/'+NS+'/wa-tiklama/up').catch(function(){});
        fetch('https://api.counterapi.dev/v1/'+NS+'/wa-gun-'+today+'/up').catch(function(){});
      }
    }, true);
  } catch(e){}
})();
</script>
</body>
</html>
